version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: standup-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-standup_alert}
      MYSQL_USER: ${DB_USER:-standupuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-standuppassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standup-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-standupuser}
      DB_PASSWORD: ${DB_PASSWORD:-standuppassword}
      DB_NAME: ${DB_NAME:-standup_alert}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Web Dashboard
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: standup-admin
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
